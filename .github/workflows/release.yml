name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches STATUSLINE_VERSION
        run: |
          set -eu
          declared=$(bash statusline.sh --version < /dev/null)
          declared=${declared##* }
          tagged=${GITHUB_REF_NAME#v}
          echo "script says $declared, tag says $tagged"
          [ "$declared" = "$tagged" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match STATUSLINE_VERSION=$declared" >&2
            exit 1
          }

      - name: Build notes
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          sum=$(sha256sum statusline.sh | cut -d' ' -f1)
          printf '%s  statusline.sh\n' "$sum" > statusline.sh.sha256

          {
            echo '## Install'
            echo
            echo '```bash'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/%s/statusline.sh \\\n' \
              "$REPO" "$GITHUB_REF_NAME"
            echo '  -o ~/.claude/statusline.sh'
            echo '```'
            echo
            echo "\`sha256\` \`$sum\`"
            echo
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git log --pretty='- %s' "$prev..$GITHUB_REF_NAME"
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case $GITHUB_REF_NAME in
            *-*) stability=--prerelease ;;
            *)   stability=--latest     ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$stability" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            statusline.sh statusline.sh.sha256
