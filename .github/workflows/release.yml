name: release

# Pushing a tag is the whole release procedure: this builds the notes, checks
# the tag against the version inside the script, and publishes.
on:
  push:
    tags: ['v*']

# Never cancel_in_progress here: a half-published release is worse than a
# duplicate run, which `gh release create` refuses on its own.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate, not a formality. ci.yml runs the same checks on the way to main,
  # but nothing connects that run to this one: pushing a commit and its tag
  # together starts both workflows at once, so the release could publish a
  # commit whose matrix was still running — or had already gone red.
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release; the checks above need none of it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      # A tag that disagrees with the script would ship a file that misreports
      # itself, and the raw URL in the notes below would be the only place the
      # real version appeared. Asked of the script itself, so --version is
      # exercised on the artifact being published.
      - name: Tag matches STATUSLINE_VERSION
        run: |
          set -eu
          declared=$(bash statusline.sh --version < /dev/null)
          declared=${declared##* }
          tagged=${GITHUB_REF_NAME#v}
          echo "script says $declared, tag says $tagged"
          [ "$declared" = "$tagged" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match STATUSLINE_VERSION=$declared" >&2
            exit 1
          }

      # Through env rather than interpolated into the script body: github.* is
      # trusted here, but a run: block that pastes an expression straight into
      # its own source is a habit that only has to be wrong once.
      - name: Build notes
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          sum=$(sha256sum statusline.sh | cut -d' ' -f1)
          printf '%s  statusline.sh\n' "$sum" > statusline.sh.sha256

          {
            echo '## Install'
            echo
            echo '```bash'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/%s/statusline.sh \\\n' \
              "$REPO" "$GITHUB_REF_NAME"
            echo '  -o ~/.claude/statusline.sh'
            echo '```'
            echo
            echo "\`sha256\` \`$sum\`"
            echo
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git log --pretty='- %s' "$prev..$GITHUB_REF_NAME"
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The tag glob is v*, which catches v1.1.0-rc1 as readily as v1.1.0.
          # A release candidate must not become the download the Install
          # section of the README sends people to.
          case $GITHUB_REF_NAME in
            *-*) stability=--prerelease ;;
            *)   stability=--latest     ;;
          esac
          # --verify-tag: publish only against a tag that exists on the remote,
          # never one gh would helpfully create from the checked-out commit.
          gh release create "$GITHUB_REF_NAME" "$stability" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            statusline.sh statusline.sh.sha256
